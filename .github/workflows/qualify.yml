name: Qualify candidate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q
      - name: Validate add-on metadata
        run: |
          python -m json.tool config.json >/dev/null
          python -m json.tool build.json >/dev/null
          test -x rootfs/etc/services.d/e-control-guest/run
      - name: Build amd64 add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('build.json'))['build_from']['amd64'])")
          docker build --build-arg BUILD_FROM="$base" --tag e-control-guest:candidate .
