name: Qualify candidate

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: e_control_guest/requirements-dev.txt
      - run: python -m pip install -r e_control_guest/requirements-dev.txt
      - run: python -m compileall -q app
        working-directory: e_control_guest
      - run: python -m pytest -q
        working-directory: e_control_guest
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test e_control_guest/tests/test_audit_ui.cjs
      - name: Validate add-on metadata
        run: |
          python -m json.tool e_control_guest/config.json >/dev/null
          python -m json.tool e_control_guest/build.json >/dev/null
          python - <<'PY'
          import json
          config = json.load(open('e_control_guest/config.json'))
          build = json.load(open('e_control_guest/build.json'))
          assert set(config['arch']) == {'amd64', 'aarch64', 'armv7', 'armhf', 'i386'}
          assert set(config['arch']) <= set(build['build_from'])
          PY
          test -f repository.yaml
          test -x e_control_guest/rootfs/etc/services.d/e-control-guest/run
      - uses: docker/setup-qemu-action@v3
      - name: Build amd64 add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('e_control_guest/build.json'))['build_from']['amd64'])")
          docker build --platform linux/amd64 --build-arg BUILD_FROM="$base" --tag e-control-guest:amd64-candidate e_control_guest
      - name: Build aarch64 add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('e_control_guest/build.json'))['build_from']['aarch64'])")
          docker build --platform linux/arm64 --build-arg BUILD_FROM="$base" --tag e-control-guest:aarch64-candidate e_control_guest
      - name: Build armv7 add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('e_control_guest/build.json'))['build_from']['armv7'])")
          docker build --platform linux/arm/v7 --build-arg BUILD_FROM="$base" --tag e-control-guest:armv7-candidate e_control_guest
      - name: Build armhf add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('e_control_guest/build.json'))['build_from']['armhf'])")
          docker build --platform linux/arm/v6 --build-arg BUILD_FROM="$base" --tag e-control-guest:armhf-candidate e_control_guest
      - name: Build i386 add-on image
        run: |
          base=$(python -c "import json; print(json.load(open('e_control_guest/build.json'))['build_from']['i386'])")
          docker build --platform linux/386 --build-arg BUILD_FROM="$base" --tag e-control-guest:i386-candidate e_control_guest
      - name: Check audit runtime on all architectures without network or device access
        run: |
          for spec in 'amd64 linux/amd64' 'aarch64 linux/arm64' 'armv7 linux/arm/v7' 'armhf linux/arm/v6' 'i386 linux/386'; do
            set -- $spec
            docker run --rm --platform "$2" --network none --read-only --tmpfs /tmp:rw,mode=1777 --entrypoint python3 "e-control-guest:$1-candidate" -c "import tempfile;from pathlib import Path;from app.audit import AuditLog;from app.origin import COUNTRIES;t=tempfile.TemporaryDirectory();a=AuditLog(Path(t.name)/'audit.db',b's'*32);a.append(actor_type='synthetic',action='login',outcome='allowed');assert a.page()['total']==1 and a.verify()==(True,None);assert len(COUNTRIES)==249;print('Audit runtime PASS');t.cleanup()"
          done
